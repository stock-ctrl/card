<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffb9cd">
<title>Menu · Crumbl North Springfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Colors and type match the Canva menu.png: blush page, pink header band, League Spartan. */
html,body{margin:0;background:#fff6f8;color:#000;font-family:"League Spartan","Helvetica Neue",Arial,sans-serif}
.page{max-width:520px;margin:0 auto}
.menu{display:block;width:100%;height:auto}
.cookies{margin:6px 4.2% 0;padding:18px 0 30px;border-top:2px solid #ffb9cd}
.cookies h2{margin:0 0 14px;font-size:clamp(28px,8.5vw,44px);font-weight:800;line-height:1;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px}
.grid figure{margin:0;text-align:center}
.grid img{display:block;width:88%;height:auto;aspect-ratio:1;margin:0 auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(120,40,60,.16))}
.grid figcaption{margin-top:10px;font-size:clamp(15px,4.4vw,19px);font-weight:700;line-height:1.15}
.band{height:28px;background:#ffb9cd}
</style>
</head>
<body>
<!-- Event menu for NFC taps. To reuse at the next event, swap menu.png and the photos below; the tag URL never changes.
     Photos are this week's lineup images from the cookie estimator (crumbl_cookie_components.image). -->
<main class="page">
<img class="menu" src="menu.png" alt="Crumbl menu. Flavors: Chocolate Chip (egg, milk, wheat, soy), Halloween Red Velvet (egg, milk, wheat, soy), Halloween Sprinkle Cake (egg, milk, wheat), Dirt Cake (egg, milk, wheat). Sizes: Single $7.00, 4-Pack $25.00, 6-Pack $35.00. Card only.">
<section class="cookies">
  <h2>Tonight's Cookies:</h2>
  <div class="grid">
    <figure><img src="photos/chocolate-chip.png" alt="Chocolate Chip cookie"><figcaption>Chocolate Chip</figcaption></figure>
    <figure><img src="photos/red-velvet.png" alt="Halloween Red Velvet cookie"><figcaption>Halloween Red Velvet</figcaption></figure>
    <figure><img src="photos/sprinkle-cake.png" alt="Halloween Sprinkle Cake cookie"><figcaption>Halloween Sprinkle Cake</figcaption></figure>
    <figure><img src="photos/dirt-cake.png" alt="Dirt Cake cookie"><figcaption>Dirt Cake</figcaption></figure>
  </div>
</section>
<div class="band"></div>
</main>
</body>
</html>
